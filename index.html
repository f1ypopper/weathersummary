<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src * self blob: data: gap:; style-src * self 'unsafe-inline' blob: data: gap:; script-src * 'self' 'unsafe-eval' 'unsafe-inline' blob: data: gap:; object-src * 'self' blob: data: gap:; img-src * self 'unsafe-inline' blob: data: gap:; connect-src self * 'unsafe-inline' blob: data: gap:; frame-src * self blob: data: gap:;">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.3/ol.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Weather Summary</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <div style="display: block; grid-template-columns: 100%; width: 100%; height: 100%;">
        <div class="wrapper">
            <div class="mapcontrols">
                <div class="btn-group-vertical" style="margin-bottom: 5px;">
                    <button class="btn btn-dark btn-sm" id="zoomin">+</button>
                    <button class="btn btn-dark btn-sm" id="zoomout">-</button>
                </div>

                <button class="btn btn-dark btn-sm" style="display: block; margin-bottom: 5px;" id="notificationtoggle">
                    <i class="bi bi-bell"></i>
                </button>

                <button class="btn btn-dark btn-sm" style="display: block; margin-bottom: 5px;" id="routetoggle"
                    value="route">
                    <i class="bi bi-compass" id="route-symbol"></i>
                    <i hidden class="bi bi-geo-alt-fill" id="marker-symbol"></i>
                </button>
            </div>
            <div class="toast-container position-absolute top-0 end-0 p-3">
                <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto" id="toast-notification-title"></strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body text-dark" id="toast-notification-body">
                    </div>
                </div>
            </div>

            <div id="map">
                <div id="popup" style="min-width: fit-content;"></div>
            </div>
            <div id="progress"></div>
        </div>

        <div id="controls">
            <div hidden>
                <label>
                    <input id="brightness" type="range" min="-0.5" max="0.5" step="0.01">
                    <br>Brightness <span id="brightness-value"></span>
                </label>
                <label>
                    <input id="contrast" type="range" min="-0.5" max="0.5" step="0.01">
                    <br>Contrast <span id="contrast-value"></span>
                </label>
            </div>
            <div hidden id="marker-details" style="display: flex; column-gap: 50px;">
                <div id="icon-list" style="display: flex; column-gap: 20px; max-width: fit-content;">
                    <p style="margin: 0; margin-left: 10px;">Icons: </p>
                </div>
                <div id="icon-current-div" style="display: flex; column-gap: 20px;">
                    <p style="margin: 0; margin-left: 10px;">Current: </p>
                    <img id="icon-current">
                </div>
            </div>
            <div hidden id="notification-details" style="display: flex; column-gap: 5%;">
                <label for="notification-title" class="form-label">Title: </label>
                <input id="notification-title" class="form-control" style="min-width: 30%;" required />
                <label for="notification-body" class="form-label">Message: </label>
                <textarea id="notification-body" class="form-control" rows="1" style="min-width: 50%;"
                    required></textarea>
                <button class="btn btn-primary" id="notification-send-btn">Notify</button>
            </div>
            <div hidden id="route-details">
            </div>
        </div>
    </div>
    <script src="./dist/mappy.js">
    </script>
    <script>
        function changeIcon(name) {
            Mappy.changeIconName(name);
        }
    </script>

</body>

</html>
